# Step 3: image registry on infra. Enable after day2-ingress-on-infra is healthy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day2-registry-on-infra
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: day2-ops
  source:
    repoURL: https://github.com/prajendrrh/ocp-day2.git
    targetRevision: main
    path: clusters/phased/registry-on-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
