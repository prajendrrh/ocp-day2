apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: day2-ops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: OpenShift Day 2 configuration from this repository (tighten sourceRepos in production).
  sourceRepos:
    - "*"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
