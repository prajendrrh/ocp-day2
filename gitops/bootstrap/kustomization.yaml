# Renders child Argo CD Applications (app-of-apps). Synced by day2-root Application.
#
# Phased validation (default): GitOps platform first, then NTP, then etcd encryption—one
# capability at a time. Add more lines under resources when each topic is proven.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../argocd/day2-appproject.yaml
  - ../applications/day2-ntp-chrony.yaml
  - ../applications/day2-etcd-encryption.yaml
  # After NTP + etcd behave as expected, add one line at a time, sync, validate:
  # - ../applications/day2-monitoring-placement.yaml
  # - ../applications/day2-log-forwarding.yaml
  # LDAP: see ../optional/application-ldap-oauth.yaml
