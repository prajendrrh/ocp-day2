# Renders child Argo CD Applications (app-of-apps). Synced by day2-root Application.
#
# Default: one combined app (NTP then etcd via sync waves) so a fresh cluster can
# converge without manual Sync clicks. Add more resources when you validate each topic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../argocd/day2-appproject.yaml
  - ../applications/day2-ntp-and-etcd.yaml
  # Optional split apps (same paths as combined; use instead of day2-ntp-and-etcd if you prefer):
  # - ../applications/day2-ntp-chrony.yaml
  # - ../applications/day2-etcd-encryption.yaml
  # After NTP + etcd behave as expected, add one line at a time:
  # - ../applications/day2-monitoring-placement.yaml
  # - ../applications/day2-log-forwarding.yaml
  # LDAP: ../optional/application-ldap-oauth.yaml
