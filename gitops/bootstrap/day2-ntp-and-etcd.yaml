# One Application: NTP (wave 5) → 20m delay (wave 10) → etcd (wave 20).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day2-ntp-and-etcd
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: day2-ops
  source:
    repoURL: https://github.com/prajendrrh/ocp-day2.git
    targetRevision: main
    path: clusters/phased/ntp-then-etcd
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
