# Experimental: one Application, true sync-wave ordering with readiness hooks.
# Enable ONLY this rollout mode OR the multi-app mode — never both on one cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day2-rollout-sequential
  namespace: openshift-gitops
spec:
  project: day2-ops
  source:
    repoURL: https://github.com/prajendrrh/ocp-day2.git
    targetRevision: main
    path: clusters/phased/day2-rollout
    kustomize:
      buildOptions: --load-restrictor LoadRestrictionsNone
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
