# Step 1 of infra rollout: MachineSets + infra MCP. Manual sync — validate ≥2 infra nodes before enabling the next app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day2-infra-nodes
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: day2-ops
  source:
    repoURL: https://github.com/prajendrrh/ocp-day2.git
    targetRevision: main
    path: clusters/phased/infra-nodes
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
