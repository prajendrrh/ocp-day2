# Argo CD controller RBAC for Day 2 cluster-scoped resources (wave -1).
# Also applied by scripts/bootstrap-fresh-cluster.sh before day2-root.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day2-argocd-rbac
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: day2-ops
  source:
    repoURL: https://github.com/prajendrrh/ocp-day2.git
    targetRevision: main
    path: clusters/phased/argocd-day2-rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
