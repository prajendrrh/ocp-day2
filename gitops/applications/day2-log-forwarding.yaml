# Manual sync by default: requires a valid SIEM endpoint, TLS material (e.g. siem-ca ConfigMap), and logging operator.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: day2-log-forwarding
  namespace: openshift-gitops
spec:
  project: day2-ops
  source:
    repoURL: https://github.com/example/ocp-day2.git
    targetRevision: main
    path: clusters/all/log-forwarding
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
