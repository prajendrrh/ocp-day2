apiVersion: batch/v1
kind: Job
metadata:
  name: day2-rollout-wait-worker-mcp
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 7500
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: day2-rollout-hooks
      restartPolicy: Never
      volumes:
        - name: scripts
          configMap:
            name: day2-rollout-hook-scripts
            defaultMode: 0755
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:latest
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          command:
            - /bin/bash
            - /scripts/wait-worker-mcp.sh
