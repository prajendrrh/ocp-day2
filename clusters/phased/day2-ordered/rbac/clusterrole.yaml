# Grants openshift-gitops-argocd-application-controller permissions for Day 2
# cluster-scoped OpenShift operator APIs (day2-ordered bundle).
# Docs: https://docs.redhat.com/en/documentation/red_hat_openshift_gitops/latest/html/declarative_cluster_configuration/
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-day2-argocd-application-controller
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: ["machineconfiguration.openshift.io"]
    resources: ["machineconfigs", "machineconfigpools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["config.openshift.io"]
    resources: ["apiservers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["machine.openshift.io"]
    resources: ["machinesets", "machines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["operator.openshift.io"]
    resources: ["ingresscontrollers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["imageregistry.operator.openshift.io"]
    resources: ["configs", "imagepruners"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
