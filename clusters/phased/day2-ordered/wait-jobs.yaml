# Inline bash wait Jobs (ose-cli). Two gates: worker MCP, then infra nodes Ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-worker-mcp
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 7200
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: wait-job
      restartPolicy: Never
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "Phase 1: wait for worker MCP to include 99-worker-chrony (avoids pre-rollout Updated=True race)..."
              until oc get machineconfigpool worker -o jsonpath='{range .status.configuration.source[*]}{.name}{"\n"}{end}' 2>/dev/null | grep -qx '99-worker-chrony'; do
                echo "99-worker-chrony not in worker MCP configuration yet; sleeping 30s..."
                sleep 30
              done
              echo "Phase 2: wait for worker MCP rollout to finish (all nodes updated and ready)..."
              until \
                [ "$(oc get machineconfigpool worker -o jsonpath='{.status.conditions[?(@.type=="Updated")].status}' 2>/dev/null)" = "True" ] && \
                [ "$(oc get machineconfigpool worker -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}' 2>/dev/null)" != "True" ] && \
                [ -n "$(oc get machineconfigpool worker -o jsonpath='{.status.machineCount}' 2>/dev/null)" ] && \
                [ "$(oc get machineconfigpool worker -o jsonpath='{.status.updatedMachineCount}' 2>/dev/null)" = "$(oc get machineconfigpool worker -o jsonpath='{.status.machineCount}' 2>/dev/null)" ] && \
                [ "$(oc get machineconfigpool worker -o jsonpath='{.status.readyMachineCount}' 2>/dev/null)" = "$(oc get machineconfigpool worker -o jsonpath='{.status.machineCount}' 2>/dev/null)" ]; do
                updated="$(oc get machineconfigpool worker -o jsonpath='{.status.updatedMachineCount}' 2>/dev/null || echo ?)"
                ready="$(oc get machineconfigpool worker -o jsonpath='{.status.readyMachineCount}' 2>/dev/null || echo ?)"
                total="$(oc get machineconfigpool worker -o jsonpath='{.status.machineCount}' 2>/dev/null || echo ?)"
                updating="$(oc get machineconfigpool worker -o jsonpath='{.status.conditions[?(@.type=="Updating")].status}' 2>/dev/null || echo ?)"
                echo "worker MCP rolling out (updated ${updated}/${total}, ready ${ready}/${total}, Updating=${updating}); sleeping 30s..."
                sleep 30
              done
              oc get machineconfigpool worker
              echo "worker MCP updated with 99-worker-chrony."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-infra-nodes
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 7200
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: wait-job
      restartPolicy: Never
      containers:
        - name: wait
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: MIN_INFRA_NODES
              value: "2"
          command:
            - /bin/bash
            - -c
            - |
              MIN_READY="${MIN_INFRA_NODES:-2}"
              echo "Waiting for at least ${MIN_READY} Ready infra nodes..."
              until [ "$(oc get nodes -l node-role.kubernetes.io/infra --no-headers 2>/dev/null | grep -c ' Ready ' || true)" -ge "${MIN_READY}" ]; do
                echo "infra nodes not ready (${MIN_READY} required); sleeping 30s..."
                sleep 30
              done
              oc get nodes -l node-role.kubernetes.io/infra
              echo "infra nodes ready."
