# Argo CD Sync hook: pause after infra MachineSets before moving platform workloads.
apiVersion: batch/v1
kind: Job
metadata:
  name: delay-after-infra-machinesets
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  ttlSecondsAfterFinished: 600
  activeDeadlineSeconds: 1500
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: wait
          image: registry.redhat.io/ubi9/ubi-minimal:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting 20 minutes after infra MachineSets before next infra workload step"
              sleep 1200
