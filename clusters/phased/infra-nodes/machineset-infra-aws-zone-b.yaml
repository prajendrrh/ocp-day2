# Copy of infra-nodes-configuration/machineset-infra-aws-zone-b.yaml (keep in sync).
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  labels:
    machine.openshift.io/cluster-api-cluster: gitops-2c2d8
  name: gitops-2c2d8-infra-eu-west-1b
  namespace: openshift-machine-api
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: gitops-2c2d8
      machine.openshift.io/cluster-api-machineset: gitops-2c2d8-infra-eu-west-1b
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: gitops-2c2d8
        machine.openshift.io/cluster-api-machine-role: infra
        machine.openshift.io/cluster-api-machine-type: infra
        machine.openshift.io/cluster-api-machineset: gitops-2c2d8-infra-eu-west-1b
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/infra: ""
      providerSpec:
        value:
          ami:
            id: ami-0b8c325b7499597c6
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
            - ebs:
                iops: 0
                volumeSize: 120
                volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: gitops-2c2d8-worker-profile
          instanceType: m6i.xlarge
          kind: AWSMachineProviderConfig
          placement:
            availabilityZone: eu-west-1b
            region: eu-west-1
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - gitops-2c2d8-node
            - filters:
                - name: tag:Name
                  values:
                    - gitops-2c2d8-lb
          subnet:
            filters:
              - name: tag:Name
                values:
                  - gitops-2c2d8-subnet-private-eu-west-1b
          tags:
            - name: kubernetes.io/cluster/gitops-2c2d8
              value: owned
          userDataSecret:
            name: worker-user-data
      taints:
        - key: node-role.kubernetes.io/infra
          effect: NoSchedule
          value: reserved
