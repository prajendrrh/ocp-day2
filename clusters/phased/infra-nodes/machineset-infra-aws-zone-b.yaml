# AWS infrastructure MachineSet — zone B (second infra node for HA).
# Use a different availability zone than zone A. Customize before apply.
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  labels:
    machine.openshift.io/cluster-api-cluster: REPLACE_INFRASTRUCTURE_ID
  name: REPLACE_INFRASTRUCTURE_ID-infra-REPLACE_ZONE_B
  namespace: openshift-machine-api
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: REPLACE_INFRASTRUCTURE_ID
      machine.openshift.io/cluster-api-machineset: REPLACE_INFRASTRUCTURE_ID-infra-REPLACE_ZONE_B
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: REPLACE_INFRASTRUCTURE_ID
        machine.openshift.io/cluster-api-machine-role: infra
        machine.openshift.io/cluster-api-machine-type: infra
        machine.openshift.io/cluster-api-machineset: REPLACE_INFRASTRUCTURE_ID-infra-REPLACE_ZONE_B
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/infra: ""
      providerSpec:
        value:
          ami:
            id: REPLACE_RHCOS_AMI_ID
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
            - ebs:
                iops: 0
                volumeSize: 120
                volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: REPLACE_INFRASTRUCTURE_ID-worker-profile
          instanceType: m6i.large
          kind: AWSMachineProviderConfig
          placement:
            availabilityZone: REPLACE_ZONE_B
            region: REPLACE_REGION
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - REPLACE_INFRASTRUCTURE_ID-node
            - filters:
                - name: tag:Name
                  values:
                    - REPLACE_INFRASTRUCTURE_ID-lb
          subnet:
            filters:
              - name: tag:Name
                values:
                  - REPLACE_INFRASTRUCTURE_ID-subnet-private-REPLACE_ZONE_B
          tags:
            - name: kubernetes.io/cluster/REPLACE_INFRASTRUCTURE_ID
              value: owned
          userDataSecret:
            name: worker-user-data
      taints:
        - key: node-role.kubernetes.io/infra
          effect: NoSchedule
