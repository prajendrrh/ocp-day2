# AWS infrastructure MachineSet — zone A (customize before apply).
# Derive providerSpec from an existing worker MachineSet: oc get machineset -n openshift-machine-api -o yaml
# Docs: https://docs.redhat.com/en/documentation/openshift_container_platform/4.22/html/machine_management/creating-infrastructure-machinesets#machineset-yaml-aws_creating-infrastructure-machinesets
apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  labels:
    machine.openshift.io/cluster-api-cluster: REPLACE_INFRASTRUCTURE_ID
  name: REPLACE_INFRASTRUCTURE_ID-infra-REPLACE_ZONE_A
  namespace: openshift-machine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: REPLACE_INFRASTRUCTURE_ID
      machine.openshift.io/cluster-api-machineset: REPLACE_INFRASTRUCTURE_ID-infra-REPLACE_ZONE_A
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: REPLACE_INFRASTRUCTURE_ID
        machine.openshift.io/cluster-api-machine-role: infra
        machine.openshift.io/cluster-api-machine-type: infra
        machine.openshift.io/cluster-api-machineset: REPLACE_INFRASTRUCTURE_ID-infra-REPLACE_ZONE_A
    spec:
      metadata:
        labels:
          node-role.kubernetes.io/infra: ""
      providerSpec:
        value:
          ami:
            id: REPLACE_RHCOS_AMI_ID
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
            - ebs:
                iops: 0
                volumeSize: 120
                volumeType: gp3
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: REPLACE_INFRASTRUCTURE_ID-worker-profile
          instanceType: m6i.large
          kind: AWSMachineProviderConfig
          placement:
            availabilityZone: REPLACE_ZONE_A
            region: REPLACE_REGION
          securityGroups:
            - filters:
                - name: tag:Name
                  values:
                    - REPLACE_INFRASTRUCTURE_ID-node
            - filters:
                - name: tag:Name
                  values:
                    - REPLACE_INFRASTRUCTURE_ID-lb
          subnet:
            filters:
              - name: tag:Name
                values:
                  - REPLACE_INFRASTRUCTURE_ID-subnet-private-REPLACE_ZONE_A
          tags:
            - name: kubernetes.io/cluster/REPLACE_INFRASTRUCTURE_ID
              value: owned
          userDataSecret:
            name: worker-user-data
      taints:
        - key: node-role.kubernetes.io/infra
          effect: NoSchedule
